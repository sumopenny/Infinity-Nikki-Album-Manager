name: Error diagnostics retention

on:
  workflow_dispatch:
  schedule:
    - cron: '25 19 * * *'

permissions:
  contents: read

concurrency:
  group: error-diagnostics-retention
  cancel-in-progress: false

jobs:
  prune:
    # 默认不执行。完成云端部署后，由仓库所有者显式设置变量和凭据。
    if: vars.ERROR_DIAGNOSTICS_MAINTENANCE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Delete expired remote diagnostics only
        run: node scripts/error-report.mjs prune --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ERROR_DIAGNOSTICS_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
